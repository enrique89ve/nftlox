	# =========================================
	# Health check interno (puerto 8081)
	# =========================================
	server {
		listen 8081;

		location /health {
			proxy_pass http://indexer/api/health;
			proxy_set_header Host $host;
		}

		location / {
			return 404;
		}
	}
}
