worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
	worker_connections 2048;
}

http {
	sendfile on;
	tcp_nopush on;
	tcp_nodelay on;
	keepalive_timeout 65;
	server_tokens off;

	# --- Logging ---
	log_format main '$remote_addr - [$time_local] "$request" '
	                '$status $body_bytes_sent rt=$request_time';
	access_log /var/log/nginx/access.log main;

	# --- Gzip (JSON responses) ---
	gzip on;
	gzip_vary on;
	gzip_proxied any;
	gzip_comp_level 4;
	gzip_min_length 256;
	gzip_types application/json text/plain;

	# --- Rate limiting zones ---
	limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
	limit_req_zone $binary_remote_addr zone=multisig:1m rate=2r/s;

	# --- Upstream ---
	upstream indexer {
		server indexer:3050;
		keepalive 32;
	}

	# =========================================
	# HTTP server (port 80)
	# =========================================
	server {
		listen 80;
		server_name _;

		# --- Security headers ---
		add_header X-Content-Type-Options nosniff always;
		add_header X-Frame-Options DENY always;
		add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
		add_header Referrer-Policy strict-origin-when-cross-origin always;
		# IMPORTANT: Enable HSTS when TLS is active (via reverse proxy or direct)
		# add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

		# --- Proxy defaults ---
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Connection "";
		proxy_buffering on;
		proxy_buffer_size 4k;
		proxy_buffers 8 8k;
		proxy_connect_timeout 5s;
		proxy_read_timeout 30s;
		proxy_send_timeout 10s;

		# --- Multisig (rate limit estricto) ---
		location /api/multisig {
			limit_req zone=multisig burst=5 nodelay;
			limit_req_status 429;
			proxy_pass http://indexer;
		}

		# --- API ---
		location /api/ {
			limit_req zone=api burst=50 nodelay;
			limit_req_status 429;
			proxy_pass http://indexer;
		}

		# --- Swagger UI (sin CSP restrictivo) ---
		location /swagger {
			proxy_pass http://indexer;
			proxy_hide_header Content-Security-Policy;
			proxy_hide_header X-Frame-Options;
		}

		# --- Bloquear todo lo demas ---
		location / {
			return 404;
		}
	}

