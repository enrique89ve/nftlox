services:
  postgres:
    profiles: ["internal-db"]
    image: postgres:16-alpine
    restart: always
    stop_grace_period: 15s
    shm_size: 256m
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nftlox_indexer}
      POSTGRES_USER: ${POSTGRES_USER:-nftlox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nftlox} -d ${POSTGRES_DB:-nftlox_indexer}"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  indexer:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    init: true
    stop_grace_period: 30s
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=64m
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    expose:
      - "3050"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_MODE: ${DATABASE_MODE:-internal}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-nftlox_indexer}
      POSTGRES_USER: ${POSTGRES_USER:-nftlox}
      NODE_ENV: production
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.5"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
  nginx:
    profiles: ["server"]
    image: nginx:1.27-alpine
    restart: always
    stop_grace_period: 10s
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    tmpfs:
      - /tmp:size=16m
      - /var/cache/nginx:size=32m
      - /var/run:size=1m
    depends_on:
      indexer:
        condition: service_healthy
    ports:
      - "${PROXY_PORT:-80}:80"
      # Descomentar para TLS:
      # - "${PROXY_SSL_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/cloudflare-realip.conf:/etc/nginx/conf.d/cloudflare-realip.conf:ro
      # Descomentar para TLS (montar certificados):
      # - ${SSL_CERT_PATH:-./nginx/ssl}:/etc/nginx/ssl:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  pgdata:
