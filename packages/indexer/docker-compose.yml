services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nftlox_indexer}
      POSTGRES_USER: ${POSTGRES_USER:-nftlox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nftlox_dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nftlox} -d ${POSTGRES_DB:-nftlox_indexer}"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  indexer:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3050"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-nftlox}:${POSTGRES_PASSWORD:-nftlox_dev}@postgres:5432/${POSTGRES_DB:-nftlox_indexer}
      INDEXER_PORT: 3050
      HEALTH_PORT: ${HEALTH_PORT:-3051}
      GENESIS_BLOCK: ${GENESIS_BLOCK}
      HIVE_ENDPOINTS: ${HIVE_ENDPOINTS:-https://api.syncad.com,https://rpc.mahdiyari.info,https://api.hive.blog}
      HIVE_ACCOUNT: ${HIVE_ACCOUNT:-nftlox}
      BATCH_SIZE: ${BATCH_SIZE:-1000}
      SYNC_INTERVAL_MS: ${SYNC_INTERVAL_MS:-3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      INDEXER_ROLE: ${INDEXER_ROLE:-both}
      NODE_URL: ${NODE_URL:-}
      NODE_ENV: production
      ENABLE_SWAGGER: "false"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      ACTIVE_KEY: ${ACTIVE_KEY:-}
      BEEKEEPER_PASSWORD: ${BEEKEEPER_PASSWORD:-}
      MULTISIG_RATE_LIMIT_MAX: ${MULTISIG_RATE_LIMIT_MAX:-10}
      MULTISIG_RATE_LIMIT_WINDOW_MS: ${MULTISIG_RATE_LIMIT_WINDOW_MS:-60000}
      MULTISIG_IP_RATE_LIMIT_MAX: ${MULTISIG_IP_RATE_LIMIT_MAX:-30}
      MULTISIG_IP_RATE_LIMIT_WINDOW_MS: ${MULTISIG_IP_RATE_LIMIT_WINDOW_MS:-60000}
      POSTGRES_DB: ${POSTGRES_DB:-nftlox_indexer}
      POSTGRES_USER: ${POSTGRES_USER:-nftlox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nftlox_dev}
    deploy:
      resources:
        limits:
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
volumes:
  pgdata:
