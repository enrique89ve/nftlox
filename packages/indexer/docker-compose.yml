services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nftlox_indexer
      POSTGRES_USER: nftlox
      POSTGRES_PASSWORD: nftlox_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql

volumes:
  pgdata:
