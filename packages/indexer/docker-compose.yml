services:
  postgres:
    image: postgres:16-alpine
    restart: always
    stop_grace_period: 15s
    shm_size: 256m
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nftlox_indexer}
      POSTGRES_USER: ${POSTGRES_USER:-nftlox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nftlox} -d ${POSTGRES_DB:-nftlox_indexer}"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  indexer:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    init: true
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=64m
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3050"
    env_file:
      - path: .env
        required: false
    environment:
      # If DATABASE_URL is in .env, use it (external Postgres).
      # Otherwise, build one pointing to the postgres service in this compose.
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-nftlox}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-nftlox_indexer}}
      NODE_ENV: production
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.5"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
volumes:
  pgdata:
